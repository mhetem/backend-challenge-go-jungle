global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: wallet
    static_configs:
      - targets: ["app-1:9090", "app-2:9090", "app-3:9090"]
    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+):\d+'
        target_label: instance
        replacement: "$1"
