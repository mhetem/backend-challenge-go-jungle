name: wager-service

x-app: &app
  build: .
  image: wager-service:local
  environment:
    COMPONENTS: http,consumer,outbox,resolver
    LOG_LEVEL: info
    HTTP_ADDR: ":8080"
    ADMIN_ADDR: ":9090"
    SHUTDOWN_TIMEOUT: 20s
    DATABASE_URL: postgres://wallet_app:${WALLET_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    AWS_REGION: ${AWS_REGION}
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    AWS_ENDPOINT_URL: http://aws:4566
    OIDC_ISSUER: http://localhost:8080/realms/wagering
    OIDC_JWKS_URL: http://keycloak:8080/realms/wagering/protocol/openid-connect/certs
  depends_on:
    postgres:
      condition: service_healthy
    keycloak:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
    aws-init:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD", "/usr/local/bin/wallet", "healthcheck"]
    interval: 5s
    timeout: 6s
    retries: 12
    start_period: 10s
  stop_grace_period: 30s

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      WALLET_MIGRATOR_PASSWORD: ${WALLET_MIGRATOR_PASSWORD}
      WALLET_APP_PASSWORD: ${WALLET_APP_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8080
      PROVIDER_A_SECRET: ${PROVIDER_A_SECRET}
      PROVIDER_B_SECRET: ${PROVIDER_B_SECRET}
      WALLET_BACKOFFICE_SECRET: ${WALLET_BACKOFFICE_SECRET}
      PROVIDER_A_SHORTLIVED_SECRET: ${PROVIDER_A_SHORTLIVED_SECRET}
      NO_ROLE_CLIENT_SECRET: ${NO_ROLE_CLIENT_SECRET}
      NO_AUDIENCE_CLIENT_SECRET: ${NO_AUDIENCE_CLIENT_SECRET}
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q 'HTTP/1.1 200' <&3
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s

  aws:
    image: ministackorg/ministack:1.5.17
    ports:
      - "4566:4566"

  aws-init:
    image: amazon/aws-cli:2.37.4
    entrypoint: ["/bin/sh", "/provision.sh"]
    environment:
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_ENDPOINT_URL: http://aws:4566
      AWS_PAGER: ""
    volumes:
      - ./deploy/aws/provision.sh:/provision.sh:ro
    depends_on:
      aws:
        condition: service_healthy

  migrate:
    build: .
    image: wager-service:local
    entrypoint: ["/usr/local/bin/migrate", "up"]
    environment:
      MIGRATE_DATABASE_URL: postgres://wallet_migrator:${WALLET_MIGRATOR_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  app-1:
    <<: *app
    hostname: app-1
    ports:
      - "8081:8080"
      - "9091:9090"

  app-2:
    <<: *app
    hostname: app-2
    ports:
      - "8082:8080"
      - "9092:9090"

  app-3:
    <<: *app
    hostname: app-3
    ports:
      - "8083:8080"
      - "9093:9090"

volumes:
  postgres-data:
